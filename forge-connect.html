<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ForgeCAD 连接 · Formwork</title>
  <link rel="stylesheet" href="./forge-connect.css">
</head>
<body>
  <header><a href="./workbench.html#overview"><b>Formwork</b> / 工程工作台</a></header>
  <main id="forge-connection">
    <h1>ForgeCAD 连接</h1>
    <p>连接你的 ForgeCAD 账户，查看服务当前提供的工具和参数。读取清单只查询接口信息。</p>
    <div class="actions">
      <button id="connect" type="button">连接 ForgeCAD</button>
      <button id="inventory" type="button">读取工具清单</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="local-entry" hidden><a href="http://127.0.0.1:4173/forge-connect.html">打开本机工作台</a></p>
    <section id="results" hidden>
      <h2 id="count">工具清单</h2>
      <div id="tools"></div>
    </section>
  </main>
  <script type="module" src="./forge-connect.js"></script>
</body>
</html>
