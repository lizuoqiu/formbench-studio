<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafbfd">
  <title>Formwork · 硬件设计</title>
  <link rel="stylesheet" href="./consumer.css">
  <link rel="stylesheet" href="./consumer-account.css">
  <link rel="stylesheet" href="./consumer-entry.css">
  <link rel="stylesheet" href="./consumer-design-images.css">
  <link rel="stylesheet" href="./consumer-workspace.css">
  <link rel="stylesheet" href="./consumer-viewer.css">
  <link rel="stylesheet" href="./consumer-gallery.css">
</head>
<body>
  <header class="header">
    <div class="mast">
      <a class="wordmark" href="./" aria-label="Formwork 首页">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m5 10 11-6 11 6-11 6zM5 16l11 6 11-6M5 22l11 6 11-6"/></svg>
        Formwork
      </a>
      <nav class="site-nav" aria-label="工作区导航">
        <a class="new-entry" href="#wish" aria-label="新建设计">新建<span class="nav-long">设计</span></a>
        <button type="button" id="back" class="quiet" aria-label="新建设计" hidden>新建<span class="nav-long">设计</span></button>
        <a class="engineering-entry" href="./workbench.html#overview" aria-label="工程工作台">工程<span class="nav-medium">工作</span>台</a>
      </nav>
      <div id="consumer-account"></div>
    </div>
  </header>
  <main id="main">
    <section id="entry" class="entry" aria-labelledby="entry-title">
      <div class="entry-hero"><div class="entry-content">
        <h1 id="entry-title">你想做什么硬件？</h1>
        <form id="intent" novalidate>
          <label for="wish" class="sr">描述你的硬件需求</label>
          <textarea id="wish" name="prompt" rows="3" maxlength="1800" required placeholder="描述你的想法，例如：做一盏按一下就能切换红绿状态的桌灯。"></textarea>
          <div class="composer-foot">
            <span id="selected-model" hidden></span>
            <button id="generate" type="submit" class="primary">生成设计</button>
          </div>
        </form>
        <div id="entry-progress" hidden>
          <div class="build-glyph" aria-hidden="true"><i></i><i></i><i></i></div>
          <div role="status" aria-live="polite"><b id="build-title"></b><p id="build-hint"></p></div>
        </div>
        <div id="entry-conversation" aria-live="polite"></div>
        <div id="entry-notice" role="status" aria-live="polite"></div>
      </div></div>
      <section class="entry-examples" aria-labelledby="examples-heading">
          <h2 id="examples-heading">精选与示例</h2>
          <div class="example-grid">
            <button id="fist-example" type="button" class="example-card" aria-label="碰拳装置示例">
              <span class="example-cover fist-cover"><img src="./assets/ui/fist.webp" alt="" width="960" height="600"></span>
              <span class="example-caption"><span><strong>桌面碰拳装置</strong><small>垂直升起，轻碰回落</small></span><span aria-hidden="true" class="card-arrow">↗</span></span>
              <span class="gallery-meta"><span>示例</span><span>仅 CAD 已核验 · 未实物验证</span></span>
            </button>
            <button id="sample" type="button" class="example-card" aria-label="状态灯示例">
              <span class="example-cover status-cover"><img src="./assets/ui/status.webp" alt="" width="960" height="600"></span>
              <span class="example-caption"><span><strong>桌面专注状态灯</strong><small>一键切换红绿灯</small></span><span aria-hidden="true" class="card-arrow">↗</span></span>
              <span class="gallery-meta"><span>示例</span><span>参考布局 · 未实物验证</span></span>
            </button>
          </div>
          <div id="studio-gallery" class="example-grid gallery-grid" aria-label="工作室精选" hidden></div>
      </section>
    </section>
    <section id="project" hidden aria-label="设计结果"></section>
  </main>
  <noscript>请启用 JavaScript 以查看三维设计和零件清单。</noscript>
  <script type="module" src="./consumer.js"></script>
</body>
</html>
