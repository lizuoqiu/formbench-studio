<div class="entry-content"><h1>今天，想做什么硬件？</h1><p class="subtitle">用一句话描述想法，生成可旋转的 CAD 方案，找到制作所需的零件。</p><form id="intent" novalidate><label for="wish" class="sr">描述你的硬件需求</label><textarea id="wish" name="prompt" rows="3" maxlength="1800" required placeholder="例如：我想做一盏桌面状态灯，按一下按钮就能切换红绿灯。"></textarea><div class="composer-foot"><button id="generate" type="submit" class="primary">生成设计 <span aria-hidden="true">→</span></button></div></form><div class="entry-bottom"><span>先看看设计结果？</span><button id="sample" class="example" type="button">查看示例 <span aria-hidden="true">↗</span></button></div><div id="entry-notice" role="status" aria-live="polite"></div></div></section>
