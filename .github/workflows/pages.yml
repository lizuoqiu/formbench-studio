name: Publish workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix server
      - run: npm ci --prefix tools --ignore-scripts
      - run: node --test tools/*.test.mjs tools/product-extension.test.cjs server/accounts.test.mjs server/cart.test.mjs server/catalog.test.mjs server/design.test.mjs server/local-codex.test.mjs server/worker.test.mjs
      - run: node tools/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: publish
        uses: actions/deploy-pages@v4
